name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version und Download-Adressen eintragen
        run: |
          python3 .github/set_urls.py "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"

      - name: Paket bauen
        run: |
          zip -r module.zip . -x ".git/*" ".github/*" ".gitignore" "*.zip"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
